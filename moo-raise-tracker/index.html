<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>MOO Raise Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129379;</text></svg>">
<style>*{margin:0;padding:0}</style>
</head>
<body>
<style>
:root{
  --ground:#F7F7F5; --panel:#FFFFFF; --panel-2:#FBFBFA;
  --ink:#16161A; --ink-2:#63636C; --ink-3:#8C8C95;
  --line:#E4E4DE; --line-2:#EFEFEA;
  --accent:#2B4C8C; --accent-soft:#EDF1F9; --accent-line:#C3D2EA; --on-accent:#FFFFFF;
  --danger:#9B2C2C;
  --s-neu-bg:#EEEFF2; --s-neu-fg:#4A4F5C;
  --s-amb-bg:#FDF1DC; --s-amb-fg:#8A5A08;
  --s-grn-bg:#E4F3E9; --s-grn-fg:#1D6437;
  --s-red-bg:#FBE9E9; --s-red-fg:#9B2C2C;
  --s-blu-bg:#E7EEFA; --s-blu-fg:#274C8F;
  --s-vio-bg:#F0EAFA; --s-vio-fg:#5B3AA6;
  --shadow:0 1px 2px rgba(20,20,26,.06), 0 8px 24px rgba(20,20,26,.06);
  --radius:8px;
  --sans:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101013; --panel:#17171B; --panel-2:#1C1C21;
    --ink:#EFEFEC; --ink-2:#96969E; --ink-3:#71717A;
    --line:#29292F; --line-2:#222227;
    --accent:#85A8E6; --accent-soft:#192237; --accent-line:#2E3F5E; --on-accent:#0E1420;
    --danger:#E38A8A;
    --s-neu-bg:#24252B; --s-neu-fg:#A9AEBC;
    --s-amb-bg:#33280F; --s-amb-fg:#E0B457;
    --s-grn-bg:#14301F; --s-grn-fg:#6DC58F;
    --s-red-bg:#341A1A; --s-red-fg:#E38A8A;
    --s-blu-bg:#17233A; --s-blu-fg:#90B4EE;
    --s-vio-bg:#251C3A; --s-vio-fg:#B396EE;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#101013; --panel:#17171B; --panel-2:#1C1C21;
  --ink:#EFEFEC; --ink-2:#96969E; --ink-3:#71717A;
  --line:#29292F; --line-2:#222227;
  --accent:#85A8E6; --accent-soft:#192237; --accent-line:#2E3F5E; --on-accent:#0E1420;
  --danger:#E38A8A;
  --s-neu-bg:#24252B; --s-neu-fg:#A9AEBC;
  --s-amb-bg:#33280F; --s-amb-fg:#E0B457;
  --s-grn-bg:#14301F; --s-grn-fg:#6DC58F;
  --s-red-bg:#341A1A; --s-red-fg:#E38A8A;
  --s-blu-bg:#17233A; --s-blu-fg:#90B4EE;
  --s-vio-bg:#251C3A; --s-vio-fg:#B396EE;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:32px;box-shadow:var(--shadow)
}
.gate-mark{font-size:26px;line-height:1;margin-bottom:18px}
.gate-card h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.gate-card p{margin:0 0 22px;color:var(--ink-2);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
input[type=password],input[type=text],select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;font-size:14px
}
textarea{resize:vertical;min-height:120px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap
}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);width:100%;padding:10px}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-danger{color:var(--danger)}
.err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:2px}

/* ---------- app shell ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.title h1{font-size:20px;margin:0;letter-spacing:-.015em}
.title .meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.title .snap{
  margin-top:7px;font-size:11.5px;color:var(--s-amb-fg);background:var(--s-amb-bg);
  border-radius:5px;padding:5px 9px;display:inline-block;max-width:62ch;line-height:1.45
}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:18px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;text-align:left;cursor:pointer;position:relative;overflow:hidden
}
.stat:hover{border-color:var(--ink-3)}
.stat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stat .n{font-family:var(--mono);font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:11px;color:var(--ink-2);margin-top:1px}
.stat .stripe{position:absolute;left:0;top:0;bottom:0;width:3px}

/* ---------- tabs + toolbar ---------- */
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:3px;gap:2px}
.tab{background:transparent;border:0;border-radius:5px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:180px;max-width:320px}

/* ---------- table ---------- */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--panel-2);position:sticky;top:0;z-index:1
}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
.acct{font-weight:600;letter-spacing:-.005em}
.sub{color:var(--ink-3);font-size:12px;margin-top:2px}
.upd{color:var(--ink-2);font-size:12.5px;max-width:400px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- pills ---------- */
.pill{
  display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;
  font-weight:600;white-space:nowrap;letter-spacing:.005em
}
.p-neu{background:var(--s-neu-bg);color:var(--s-neu-fg)}
.p-amb{background:var(--s-amb-bg);color:var(--s-amb-fg)}
.p-grn{background:var(--s-grn-bg);color:var(--s-grn-fg)}
.p-red{background:var(--s-red-bg);color:var(--s-red-fg)}
.p-blu{background:var(--s-blu-bg);color:var(--s-blu-fg)}
.p-vio{background:var(--s-vio-bg);color:var(--s-vio-fg)}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-width:280px}
.chip{
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);
  border-radius:5px;padding:2px 7px;font-size:11.5px;white-space:nowrap
}
.chip button{background:none;border:0;cursor:pointer;padding:0 0 0 5px;color:inherit;opacity:.65;font-size:13px;line-height:1}
.chip button:hover{opacity:1}
.type-tag{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.when{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* ---------- slide-over ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,12,16,.42);z-index:20}
.sheet{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);
  border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;
  box-shadow:-8px 0 32px rgba(0,0,0,.14)
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:15px;margin:0;letter-spacing:-.01em}
.sheet-body{padding:20px;overflow-y:auto;flex:1}
.sheet-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.x{background:none;border:0;cursor:pointer;color:var(--ink-2);font-size:20px;line-height:1;padding:2px 6px}
.x:hover{color:var(--ink)}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.note{
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:6px;
  padding:10px 12px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:7px;
  font-size:13px;z-index:40;box-shadow:var(--shadow)
}
@media (max-width:640px){
  .wrap{padding:16px 12px 60px}
  .stat .n{font-size:18px}
}
</style>

const INV_STATUS = ["Introduced","Engaged","Closed Won","Closed Lost"];
const CON_STATUS = ["Reached Out","Connected","Making Intros"];
const TYPES = ["Fund","Angel"];
const PILL = {
  "Introduced":"p-neu","Engaged":"p-amb","Closed Won":"p-grn","Closed Lost":"p-red",
  "Reached Out":"p-neu","Connected":"p-blu","Making Intros":"p-vio"
};
const STRIPE = {
  "Introduced":"var(--s-neu-fg)","Engaged":"var(--s-amb-fg)",
  "Closed Won":"var(--s-grn-fg)","Closed Lost":"var(--s-red-fg)",
  "Reached Out":"var(--s-neu-fg)","Connected":"var(--s-blu-fg)","Making Intros":"var(--s-vio-fg)"
};
const LS_KEY = "moo-raise-tracker-v1";

let DATA = null, PASS = null, TAB = "investors", FILTER = null, Q = "", OPEN = null;

/* ---------- crypto ---------- */
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
async function decryptPayload(p, pass){
  const key = await deriveKey(pass, b64d(p.salt), p.iter);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(p.iv)}, key, b64d(p.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function encryptPayload(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, PAYLOAD.iter);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key,
    new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, iter:PAYLOAD.iter, salt:b64e(salt), iv:b64e(iv), ct:b64e(ct)};
}

/* ---------- persistence ---------- */
async function persist(){
  try{
    const blob = await encryptPayload(DATA, PASS);
    localStorage.setItem(LS_KEY, JSON.stringify(blob));
  }catch(e){ /* storage unavailable — in-memory only */ }
}
async function loadLocal(pass){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw) return null;
  try{ return await decryptPayload(JSON.parse(raw), pass); }catch(e){ return null; }
}

/* ---------- utils ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,9);
const rows = () => TAB==="investors" ? DATA.investors : DATA.connectors;
const statuses = () => TAB==="investors" ? INV_STATUS : CON_STATUS;
const invName = id => (DATA.investors.find(i=>i.id===id)||{}).name || "—";

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function visible(){
  const q = Q.trim().toLowerCase();
  return rows().filter(r=>{
    if(FILTER && r.status !== FILTER) return false;
    if(!q) return true;
    const hay = TAB==="investors"
      ? [r.name,r.type,r.introBy,r.status,r.updates]
      : [r.name,r.status,r.accountAlso,r.updates,...(r.connectingTo||[]).map(invName)];
    return hay.join(" ").toLowerCase().includes(q);
  }).sort((a,b)=> String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));
}

/* Most recent updatedAt across both tables — the "last activity" stamp. */
function lastActivity(){
  const all = [...DATA.investors, ...DATA.connectors].map(r=>r.updatedAt).filter(Boolean).sort();
  return all.length ? all[all.length-1] : null;
}
/* "3d ago" style, from a YYYY-MM-DD stamp. */
function ago(d){
  if(!d) return "—";
  const then = new Date(d + (d.length===10 ? "T12:00:00" : ""));
  if(isNaN(then)) return d;
  const days = Math.floor((Date.now() - then) / 86400000);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 30) return days + "d ago";
  if(days < 365) return Math.floor(days/30) + "mo ago";
  return Math.floor(days/365) + "y ago";
}

/* ---------- gate ---------- */
function renderGate(err){
  document.getElementById("app").innerHTML = `
    <div class="gate"><div class="gate-card">
      <div class="gate-mark">🥣</div>
      <h1>MOO Raise Tracker</h1>
      <p>Enter the password to unlock. The pipeline data is encrypted — without it there is nothing to read in this page's source.</p>
      <form id="gf">
        <div class="field">
          <label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" autofocus>
        </div>
        <div class="err">${esc(err||"")}</div>
        <button class="btn btn-primary" type="submit">Unlock</button>
      </form>
    </div></div>`;
  document.getElementById("gf").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const btn = e.target.querySelector("button");
    btn.textContent = "Unlocking…"; btn.disabled = true;
    try{
      const seed = await decryptPayload(PAYLOAD, pw);
      PASS = pw;
      DATA = (await loadLocal(pw)) || seed;
      render();
    }catch(err){
      renderGate("That password didn't work. Try again.");
    }
  });
}

        </div>
        <div class="actions">
          <button class="btn" data-act="add">+ Add ${TAB==="investors"?"investor":"connector"}</button>
          <button class="btn" data-act="export">Export</button>
          <button class="btn" data-act="import">Import</button>
          <button class="btn" data-act="lock">Lock</button>
        </div>
      </header>

      <div class="stats">
        ${statuses().map(s=>`
          <button class="stat" data-filter="${esc(s)}" aria-pressed="${FILTER===s}">
            <span class="stripe" style="background:${STRIPE[s]}"></span>
            <div class="n">${counts[s]}</div>
            <div class="k">${esc(s)}</div>
          </button>`).join("")}
      </div>

      <div class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="${TAB==="investors"}" data-tab="investors">Investors</button>
          <button class="tab" role="tab" aria-selected="${TAB==="connectors"}" data-tab="connectors">Connectors</button>
        </div>
        <input class="search" id="q" type="text" placeholder="Search names, status, notes…" value="${esc(Q)}">
      </div>

      <div class="tablewrap">
        ${list.length ? (TAB==="investors" ? invTable(list) : conTable(list))
          : `<div class="empty">Nothing matches. ${FILTER?"Clear the status filter or ":""}try a different search.</div>`}
      </div>
    </div>
    ${OPEN ? sheet() : ""}`;

  wire();
}

function invTable(list){
  return `<table><thead><tr>
      <th>Account name</th><th>Type</th><th>Intro by</th><th>Current status</th><th>Updated</th><th>Updates</th>
    </tr></thead><tbody>
    ${list.map(r=>`<tr data-id="${r.id}">
      <td class="acct">${esc(r.name)}</td>
      <td><span class="type-tag">${esc(r.type)}</span></td>
      <td>${esc(r.introBy)||"—"}</td>
      <td><span class="pill ${PILL[r.status]}">${esc(r.status)}</span></td>
      <td><span class="when" title="${esc(r.updatedAt||"")}">${esc(ago(r.updatedAt))}</span></td>
      <td><div class="upd">${esc(r.updates)}</div></td>
    </tr>`).join("")}
  </tbody></table>`;
}

function conTable(list){
  return `<table><thead><tr>
      <th>Name</th><th>Status</th><th>Account also?</th><th>Connecting to</th><th>Updated</th><th>Updates</th>
    </tr></thead><tbody>
    ${list.map(r=>`<tr data-id="${r.id}">
      <td class="acct">${esc(r.name)}</td>
      <td><span class="pill ${PILL[r.status]}">${esc(r.status)}</span></td>
      <td>${r.accountAlso ? esc(r.accountAlso) : '<span class="sub">—</span>'}</td>
      <td><div class="chips">${(r.connectingTo||[]).length
          ? r.connectingTo.map(id=>`<span class="chip">${esc(invName(id))}</span>`).join("")
          : '<span class="sub">—</span>'}</div></td>
      <td><span class="when" title="${esc(r.updatedAt||"")}">${esc(ago(r.updatedAt))}</span></td>
      <td><div class="upd">${esc(r.updates)}</div></td>
    </tr>`).join("")}
  </tbody></table>`;
}

function sheet(){
  const r = rows().find(x=>x.id===OPEN);
  if(!r) return "";
  const isInv = TAB==="investors";
  return `
  <div class="scrim" data-act="close"></div>
  <aside class="sheet" role="dialog" aria-label="Edit record">
    <div class="sheet-head">
      <h2>${esc(r.name)||"New record"}</h2>
      <button class="x" data-act="close" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <div class="field"><label for="f-name">${isInv?"Account name":"Name"}</label>
        <input id="f-name" type="text" value="${esc(r.name)}"></div>

      ${isInv ? `
        <div class="field"><label for="f-type">Type</label>
          <select id="f-type">${TYPES.map(t=>`<option ${r.type===t?"selected":""}>${t}</option>`).join("")}</select></div>
        <div class="field"><label for="f-intro">Intro by</label>
          <input id="f-intro" type="text" value="${esc(r.introBy)}"></div>
      ` : `
        <div class="field"><label for="f-also">Account also?</label>
          <input id="f-also" type="text" value="${esc(r.accountAlso)}" placeholder="Leave blank if they're only a connector">
          <div class="hint">Set this when the person is also an investor account in their own right.</div></div>
      `}

      <div class="field"><label for="f-status">${isInv?"Current status":"Status"}</label>
        <select id="f-status">${statuses().map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></div>

      ${!isInv ? `
        <div class="field"><label>Connecting to</label>
          <div class="chips" id="ct-chips">${(r.connectingTo||[]).map(id=>
            `<span class="chip">${esc(invName(id))}<button data-rm="${id}" aria-label="Remove">×</button></span>`).join("")
            || '<span class="sub">No accounts linked yet</span>'}</div>
          <select id="ct-add" style="margin-top:8px">
            <option value="">+ Link an investor account…</option>
            ${DATA.investors.filter(i=>!(r.connectingTo||[]).includes(i.id))
              .map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join("")}
          </select>
        </div>` : ""}

      <div class="field"><label for="f-upd">Updates</label>
        <textarea id="f-upd">${esc(r.updates)}</textarea></div>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-danger" data-act="delete">Delete</button>
      <button class="btn btn-primary" style="width:auto" data-act="save">Save</button>
    </div>
  </aside>`;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    TAB=b.dataset.tab; FILTER=null; OPEN=null; render();
  });
  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
    FILTER = FILTER===b.dataset.filter ? null : b.dataset.filter; render();
  });
  const q = document.getElementById("q");
  if(q) q.oninput = e => { Q = e.target.value; const p=e.target.selectionStart; render();
    const n=document.getElementById("q"); if(n){n.focus(); n.setSelectionRange(p,p);} };

  document.querySelectorAll("tbody tr").forEach(tr=>tr.onclick=()=>{ OPEN=tr.dataset.id; render(); });

  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick = ev => {
      const a = el.dataset.act;
      if(a==="close"){ OPEN=null; render(); }
      if(a==="add"){ addRow(); }
      if(a==="save"){ saveRow(); }
      if(a==="delete"){ deleteRow(); }
      if(a==="lock"){ DATA=null; PASS=null; OPEN=null; renderGate(); }
      if(a==="export"){ doExport(); }
      if(a==="import"){ doImport(); }
    };
  });

  const add = document.getElementById("ct-add");
  if(add) add.onchange = e => {
    if(!e.target.value) return;
    const r = rows().find(x=>x.id===OPEN);
    r.connectingTo = [...(r.connectingTo||[]), e.target.value];
    persist(); render();
  };
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=ev=>{
    ev.stopPropagation();
    const r = rows().find(x=>x.id===OPEN);
    r.connectingTo = (r.connectingTo||[]).filter(id=>id!==b.dataset.rm);
    persist(); render();
  });

  document.onkeydown = e => { if(e.key==="Escape" && OPEN){ OPEN=null; render(); } };
}

const today = () => new Date().toISOString().slice(0,10);

function addRow(){
  const r = TAB==="investors"
    ? {id:uid("i"),name:"",type:"Fund",introBy:"",status:"Introduced",updatedAt:today(),updates:""}
    : {id:uid("c"),name:"",status:"Reached Out",accountAlso:"",connectingTo:[],updatedAt:today(),updates:""};
  rows().unshift(r); OPEN=r.id; render();
}

function saveRow(){
  const r = rows().find(x=>x.id===OPEN); if(!r) return;
  const v = id => { const el=document.getElementById(id); return el?el.value.trim():undefined; };
  r.name = v("f-name") || "Untitled";
  r.status = v("f-status");
  r.updates = document.getElementById("f-upd").value.trim();
  if(TAB==="investors"){ r.type = v("f-type"); r.introBy = v("f-intro"); }
  else { r.accountAlso = v("f-also"); }
  r.updatedAt = today();
  persist(); OPEN=null; render(); toast("Saved");
}

function deleteRow(){
  const r = rows().find(x=>x.id===OPEN); if(!r) return;
  const arr = rows(); arr.splice(arr.indexOf(r),1);
  if(TAB==="investors") DATA.connectors.forEach(c=>{
    c.connectingTo = (c.connectingTo||[]).filter(id=>id!==r.id);
  });
  persist(); OPEN=null; render(); toast("Deleted");
}

/* ---------- export / import ---------- */
async function doExport(){
  const dl = (typeof claude !== "undefined" && claude.use) ? await claude.use("downloads") : null;
  const plain = JSON.stringify(DATA, null, 2);
  const fname = `moo-raise-tracker-${new Date().toISOString().slice(0,10)}.json`;
  if(!dl){
    const url = URL.createObjectURL(new Blob([plain],{type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Exported');
    return;
  }
  try{
    await dl.save({filename:fname, data:plain});
    toast("Exported");
  }catch(e){
    if(e && e.code==="declined") return;
    toast("Couldn't save that file");
  }
}

function doImport(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const j = JSON.parse(rd.result);
        if(!Array.isArray(j.investors) || !Array.isArray(j.connectors))
          throw new Error("shape");
        DATA = j; FILTER=null; OPEN=null; persist(); render(); toast("Imported");
      }catch(e){ toast("That file isn't a tracker export"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

renderGate();
</script>
